<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email</title>
  <script src="https://cdn.jsdelivr.net/npm/axios@0.21.1/dist/axios.min.js"></script>
  <script type="module" src="/static/interceptor.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; 
      padding: 0;
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }

    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }

    h1 {
      margin-bottom: 1rem;
    }

    p {
      margin-bottom: 1.5rem;
    }

    button {
      background: #007BFF;
      border: none;
      border-radius: 5px;
      padding: 0.7rem 1.2rem;
      font-size: 1rem;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #0056b3;
    }

    .note {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #666;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Check Your Email!</h1>
    <p>We’ve sent a verification email to your address. Please click the link in that email to activate your account.</p>
    <p>If you don’t see an email, check your spam folder.</p>
    
    <!-- Resend verification button -->
    <button id="resendBtn">Resend Verification Email</button>
    <p class="note">Didn’t receive the email? Try resending.</p>
  </div>

  <script type="module">
    import { apiClient } from './static/interceptor.js';
    const resendBtn = document.getElementById('resendBtn');
    const userEmail = "{{ email }}"; // Replace with dynamic email from server

      // Disable button to prevent multiple clicks
      resendBtn.disabled = true;
      resendBtn.classList.add('loading');
      resendBtn.textContent = 'Resending...';
    resendBtn.addEventListener('click', async () => {
      // Disable button to prevent multiple clicks
      resendBtn.disabled = true;
      resendBtn.classList.add('loading');
      resendBtn.textContent = 'Resending...';

      try {
        // Send POST request to the backend to resend the verification email
        const response = await apiClient.post('/email-verification/resend', {email: userEmail}, {
          headers: { 'Content-Type': 'application/json' }
        });

        if (response.status === 200) {
          alert('Verification email resent! Check your inbox.');
        } else {
          alert('Failed to resend email. Please try again or contact support.');
        }
      } catch (error) {
        console.error('Failed to resend verification email:', error);
        alert('An error occurred while resending the email. Please try again later.');
      } finally {
        // Re-enable the button
        resendBtn.disabled = false;
        resendBtn.classList.remove('loading');
        resendBtn.textContent = 'Resend Verification Email';
      }
    });
  </script>
</body>
</html>
