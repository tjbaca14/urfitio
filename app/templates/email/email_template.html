<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #ffffff;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            line-height: 1.5;
            margin: 0;
        }
        .email-container {
            max-width: 600px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }
        .header {
            background-color: #3b82f6;
            padding: 20px;
            text-align: center;
            color: white;
        }
        .header h1 {
            font-size: 2rem;
            margin: 0;
        }
        .content {
            padding: 20px;
            text-align: center;
            color: #0f172a;
        }
        .content p {
            margin: 10px 0;
        }
        .verify-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3b82f6;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .verify-button:hover {
            background-color: #2563eb;
        }
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 0.875rem;
            color: #6b7280;
            background-color: #f9fafb;
            border-top: 1px solid #e2e8f0;
        }
        .footer a {
            color: #3b82f6;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header Section -->
        <div class="header">
            <h1>Welcome to UrFit.io!</h1>
        </div>
        <!-- Content Section -->
        <div class="content">
            <p>Welcome to UrFit.io! Thanks for joining our community!</p>
            <p>Please verify your email to activate your account:</p>
            <a href="{{ verification_link }}" class="verify-button">Verify Email</a>
        </div>
        <!-- Footer Section -->
        <div class="footer">
            <p>&copy; 2025 urfit.io. All rights reserved.</p>
            <p>Follow us on 
                <a href="https://instagram.com/urfit.io">Instagram</a>, 
                <a href="https://facebook.com/urfit.io">Facebook</a>, or 
                <a href="https://twitter.com/urfit_io">Twitter</a>.
            </p>
        </div>
    </div>
</body>
</html>
