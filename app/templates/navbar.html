<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrFit.io</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios@0.21.1/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.21.1/dist/axios.min.js"></script>
    <script type="module" src="/static/interceptor.js"></script> <!-- Import apiClient.js -->
    <style>
        /* Navbar styles */
#navbar {
    width: 100%;
    background-color: #1e293b;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    box-sizing: border-box;
    position: fixed;
}

.navbar-logo a {
    font-size: 1.5rem;
    font-weight: bold;
    color: #f8fafc;
    text-decoration: none;
    letter-spacing: -0.025em;
}

.navbar-links {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar-links a {
    margin-left: 2rem;
    color: #f8fafc;
    text-decoration: none;
    font-size: 1.1rem;
    transition: color 0.3s ease;
}

.navbar-links a:hover {
    color: #60a5fa;
}

/* Hamburger Menu Styles */
#navbar .hamburger {
    display: none;
    cursor: pointer;
    flex-direction: column;
    justify-content: space-between;
    width: 30px;
    height: 20px;
}

#navbar .hamburger div {
    background-color: #f8fafc;
    height: 4px;
    width: 100%;
}

/* Mobile menu (hidden by default) */
#navbar .mobile-menu {
    display: none;
    flex-direction: column;
    position: absolute;
    top: 70px;
    left: 0;
    width: 100%;
    background-color: #1e293b;
    padding: 1rem 2rem;
}

#navbar .mobile-menu a {
    margin: 0.5rem 0;
    color: #f8fafc;
    text-decoration: none;
    font-size: 1.1rem;
}

/* Show hamburger and mobile menu on small screens */
@media screen and (max-width: 768px) {
    /* .navbar-links {
        display: none;
    }

    #navbar .hamburger {
        display: flex;
    } */

    #navbar .mobile-menu {
        display: flex;
    }
}
        .logout-link {
            font-size: 0.85rem;
            color: white;
            text-decoration: none;
            margin-left: auto; /* Pushes it to the far right */
            opacity: 0.8; /* Slightly faded */
            cursor: pointer;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        .logout-link:hover {
            opacity: 1;
            text-decoration: underline;
            color: #d9d9d9;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav id="navbar">
        <div class="navbar-logo">
            <a href="/">UrFit.io</a>
        </div>
        <div class="navbar-links">
            <a href="/chat">Home</a>
            <a href="/about">About</a>
            <!-- <a href="/data-sources" id="data-sources">Data</a> -->
        </div>
            <a href="#" class="logout-link">Logout</a>
    </nav>
    
</body>

<script type="module">
    import {apiClient} from './static/interceptor.js'
    document.addEventListener("DOMContentLoaded", () => {
        const logoutLink = document.querySelector(".logout-link");
        const dataSources = document.getElementById("data-sources")
        if (window.location.pathname === "/login") {
            logoutLink.style.visibility = "hidden";
            
            // logoutLink.style.display = "none";
        }
        logoutLink.addEventListener("click", async (event) => {

            try {
                const response = await apiClient.get("/api/v1/logout", {}, {
                    headers: {
                        "Content-Type": "application/json"
                    },
                    withCredentials: true // Include cookies if needed
                });

                if (response.status === 200) {
                    // Redirect to the login page or home after logout
                    window.location.href = "/login";
                } else {
                    console.error("Failed to logout:", response.status);
                    toastr.alert("Error logging out. Please try again.", "Error");
                }
            } catch (error) {
                console.error("Logout request failed:", error);
                toastr.error("An error occurred. Please try again.", "Error");
            }
        });
    });
</script>
</html>
