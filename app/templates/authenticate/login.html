<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Your custom CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
  
  <!-- jQuery (required by Toastr v2.1.4) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  
  <!-- Toastr JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios@0.21.1/dist/axios.min.js"></script>

  <title>UrFit.io</title>
  <style>
    
     .login-container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
      margin: 120px auto;
    }

    .login-container h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .login-container p {
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .login-container label {
      display: block;
      font-weight: bold;
      margin: 10px 0 5px;
      text-align: left;
    }

    .login-container input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
    }

    .login-container button {
      background: #ffffff;
      color: #000000;
      font-size: 1rem;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .login-container button:hover {
      background: #000000;
      color: #ffffff;
    }

    .login-container a {
      display: block;
      margin-top: 10px;
      color: #ffffff;
      text-decoration: underline;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <!-- <nav id="navbar">
    <div class="navbar-logo">
      <a href="/">UrFit.io</a>
    </div>
  </nav> -->
  {% include 'navbar.html' %}

  <div class="login-container">
    <h1>Welcome Back!</h1>
    <p>Please log in to continue</p>
    
    <form id="login-form" action="/token" method="post">
      <!-- Email -->
      <label for="email">Email:</label>
      <input 
        type="email" 
        name="email" 
        id="email" 
        placeholder="Enter your email" 
        required 
      />
      
      <!-- Password -->
      <label for="password">Password:</label>
      <input 
        type="password" 
        name="password" 
        id="password" 
        placeholder="Enter your password" 
        required 
      />
      
      <button type="submit">Login</button>
    </form>

    <a href="/register">Don't have an account? Sign up</a>
    <a href="/password-reset-request">Forgot password?</a>
  </div>

  <script type="module">
    import { apiClient } from "./static/interceptor.js"
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Build form data
      const form = new FormData();
      form.append('username', email);
      form.append('password', password);

      try {
        // Attempt login
        const response = await apiClient.post("/api/v1/token", form);

        // If successful, redirect
        window.location.href = "/chat";
      } catch (error) {
        // Log the error for debugging purposes
        console.error(error);

        // If the backend returns 401 for invalid credentials
        if (error.response && error.response.status === 401) {
          toastr.error("Invalid username or password!", "Login Failed");
        } else {
          toastr.error("Unable to login. Please try again later.", "Error");
        }
      }
    });
  </script>
</body>
</html>
