<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.21.1/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script type="module" src="/static/interceptor.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
    
    <style>
 .reset-container {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    text-align: center;
    max-width: 450px;
    width: 100%;
    margin: 120px auto;
}

.reset-container h1 {
    font-size: 2rem;
    margin-bottom: 10px;
}

.reset-container p {
    font-size: 1rem;
    margin-bottom: 20px;
}

.reset-container form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.reset-container label {
    display: block;
    font-weight: bold;
    margin: 10px 0 5px;
    text-align: left;
}

.reset-container input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: none;
    border-radius: 5px;
    font-size: 1rem;
    box-sizing: border-box;
    height: 44px;
    background-repeat: no-repeat;
    background-position: right 0.75rem center;
    background-size: 1.25rem;
}

.reset-container .button {
    background: #ffffff;
    color: #000000;
    text-decoration: none;
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease;
}

.reset-container .button:hover {
    background: #ffffff;
    color: #000000;
    transition: background 0.3s ease, color 0.3s ease;
}

.reset-container .login-link {
    margin-top: 10px;
    font-size: 0.875rem;
}

.reset-container .login-link a {
    color: #ffffff;
    text-decoration: underline;
    font-size: 0.9rem;
}

.reset-container .login-link a:hover {
    text-decoration: underline;
}

    </style>
</head>
<body>
    <div class="reset-container">
        <h1>Reset Password</h1>
        <form id="resetForm">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="newPassword" placeholder="New Password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            <button type="submit" class="button">Reset Password</button>
        </form>
        <div class="login-link">
            <a href="/login">Go back to Login</a>
        </div>
    </div>

    <!-- Main JS that references toastr as a global -->
    <script type="module">
        import {apiClient} from "../static/interceptor.js"
        const form = document.getElementById('resetForm');


        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (newPassword.length < 8 ) {
                toastr.error('Password must be at least 8 characters long!', 'Error');
                return;
            }
            if (newPassword !== confirmPassword) {
                toastr.error('Passwords do not match!', 'Error');
                return;
            }

            try {
                // Using Axios
                const response = await apiClient.post('/api/v1/password-reset', {
                    username: email,
                    password: newPassword
                });

                if (response.status === 200) {
                    toastr.success('Password reset successful! Redirecting to login...', 'Success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    toastr.error('Failed to reset password. Please try again.', 'Error');
                }
            } catch (error) {
                if (error.response) {
                    toastr.error(error.response.data.message || 'Failed to reset password.', 'Error');
                } else {
                    toastr.error('An error occurred. Please try again.', 'Error');
                }
                console.error(error);
            }
        });
    </script>
</body>
</html>
