<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.21.1/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script type="module" src="/static/interceptor.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
    
    <style>
 .reset-container {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    text-align: center;
    max-width: 450px;
    width: 100%;
    margin: 120px auto;
}

.reset-container h1 {
    font-size: 2rem;
    margin-bottom: 10px;
}

.reset-container p {
    font-size: 1rem;
    margin-bottom: 20px;
}

.reset-container form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.reset-container label {
    display: block;
    font-weight: bold;
    margin: 10px 0 5px;
    text-align: left;
}

.reset-container input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: none;
    border-radius: 5px;
    font-size: 1rem;
    box-sizing: border-box;
    height: 44px;
    background-repeat: no-repeat;
    background-position: right 0.75rem center;
    background-size: 1.25rem;
}

.reset-container .button {
    background: #ffffff;
    color: #000000;
    text-decoration: none;
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease;
}

.reset-container .button:hover {
    background: #ffffff;
    color: #000000;
    transition: background 0.3s ease, color 0.3s ease;
}

.reset-container .login-link {
    margin-top: 10px;
    font-size: 0.875rem;
}

.reset-container .login-link a {
    color: #ffffff;
    text-decoration: underline;
    font-size: 0.9rem;
}

.reset-container .login-link a:hover {
    text-decoration: underline;
}

    </style>
</head>
<body>
    <nav id="navbar">
        <div class="navbar-logo">
          <a href="/">UrFit.io</a>
        </div>
      </nav>
      
    <div class="reset-container">
        <h1>Forgot Your Password?</h1>
        <p>Enter your email address to receive a password reset link.</p>
        <form action="/forgot-password" method="POST">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email" />
            <button class="button" type="submit">Send Reset Link</button>
        </form>
        <p class="login-link">
            <a href="/login">Back to Login</a>
        </p>
    </div>
</body>
<script type="module">
    import {apiClient} from './static/interceptor.js'
    document.querySelector('form[action="/forgot-password"]').addEventListener('submit', async (event) => {
      event.preventDefault();
  
      const email = document.getElementById('email').value.trim();
  
      try {
        const response = await apiClient.post('/password-reset-email', { email });
        toastr.success('Password reset link sent to your email.', 'Success');
      } catch (error) {
        console.error(error);
        toastr.alert('An error occurred. Please try again.', 'Error');
      }
    });
  </script>
</html>
