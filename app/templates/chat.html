<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
  
    <!-- jQuery (required by Toastr v2.1.4) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    
    <!-- Toastr JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.21.1/dist/axios.min.js"></script>
    <script type="module" src="/static/interceptor.js"></script> <!-- Import apiClient.js -->
    <title>UrFit.io</title>
    <style>
.logout-link {
            font-size: 0.85rem;
            color: white;
            text-decoration: none;
            margin-left: auto; /* Pushes it to the far right */
            opacity: 0.8; /* Slightly faded */
            cursor: pointer;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        .logout-link:hover {
            opacity: 1;
            text-decoration: underline;
            color: #d9d9d9;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}


    <!-- Survey Feedback Link -->
    <div id="survey-link-container">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSe2ar1MfhnjuhnydR7NmdEBfwoej6dxVgQ-wSAme-EGlfrpzg/viewform?usp=header" target="_blank" id="survey-link">Want to win a $200 Better Baseball gift card? Take our quick survey and enter for your chance!</a>
    </div>

    <!-- Dropdown for selecting a school -->
    <div id="coach-dropdown-container">
        <select id="division-dropdown">
            <option value="default" selected>Select a division</option>
            <option value="D1">D1</option>
            <option value="D2">D2</option>
            <option value="D3">D3</option>
        </select>
        <select id="coach-dropdown">
            <!-- Options will be populated dynamically from the backend -->
            <option value="default" selected>Select a school</option>
        </select>


    </div>

    <!-- Chips for common questions -->
    <div id="chips-container">
        <div class="chip">Provide a summary of this coach.</div>
        <div class="chip">How does this coach compare to his peers?</div>
        <div class="chip">Describe the attributes of pitcher recruits.</div>
        <div class="chip">Am I a good fit for this coach?</div>
    </div>

    <!-- Chat container -->
    <div id="chat-container">
        <!-- Messages will be dynamically appended here -->
    </div>

    <!-- Input container -->
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type your message...">
        <button id="send-button">Send</button>
    </div>

    <!-- {% include 'footer.html' %} -->
    <script type="module">
        import { apiClient } from './static/interceptor.js';
    
        let userId = null;
        let chatId = null;
        let chatHistory = [];

        const sendButton = document.getElementById('send-button');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');
        const coachDropdown = document.getElementById('coach-dropdown');
        const divisionDropdown = document.getElementById('division-dropdown');
        const chipsContainer = document.getElementById('chips-container');
    
        // Function to generate a unique ID
        function generateUniqueId(prefix) {
            return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        }
    
        // Function to initialize a new chat session
        function initializeChatSession() {
            userId = "{{ username }}"
            chatId = generateUniqueId('chat');
            chatHistory = [];
            console.log(`New chat session started: ${chatId}`);
        }
    
        // Function to show a loading indicator
        function showLoadingIndicator() {
            const loadingDiv = document.createElement('div');
            loadingDiv.classList.add('message', 'assistant', 'loading');
            loadingDiv.id = 'loading-indicator';
    
            const loadingText = document.createElement('div');
            loadingText.classList.add('message-text');
            loadingText.innerHTML = '...';
    
            loadingDiv.appendChild(loadingText);
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    
        // Function to hide the loading indicator
        function hideLoadingIndicator() {
            const loadingIndicator = document.getElementById('loading-indicator');
            if (loadingIndicator) {
                loadingIndicator.remove();
            }
        }
    
        // Function to fetch schools
        async function fetchSchools(division) {
            try {
                console.log(`Fetching schools for division: ${division}`);
                const response = await apiClient.get(`/api/v1/schools?division=${division}`);
                return response.data || [];
            } catch (error) {
                console.error('Error fetching schools:', error);
            }
            return [];
        }

        async function saveChatHistory() {
            try {
                const chatHistoryModel = {
                    id: chatId,
                    userId: userId,
                    messages: chatHistory,
                };

                await apiClient.post('/api/v1/save/chat', chatHistoryModel);
                console.log('Chat history saved successfully.');
            } catch (error) {
                console.error('Error saving chat history:', error);
            }
        };
    
        // Function to populate the school dropdown
        async function populateSchoolDropdown(division) {
            const schools = await fetchSchools(division);
            coachDropdown.innerHTML = '<option value="">Select a school</option>';
            if (schools.length === 0) {
                coachDropdown.innerHTML = '<option value="">No schools available</option>';
                return;
            }
    
            schools.forEach((school) => {
                const option = document.createElement('option');
                option.value = school.name;
                option.textContent = school.name;
                coachDropdown.appendChild(option);
            });
        }
    
        // Function to append a message to the chat
        function appendMessage(role, message) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', role === 'user' ? 'user' : 'assistant');
    
            const messageText = document.createElement('div');
            messageText.classList.add('message-text');
            messageText.innerHTML = message.replace(/\n/g, '<br>');
    
            messageDiv.appendChild(messageText);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    
        async function sendMessage() {
    const message = userInput.value.trim();
    const selectedSchoolName = coachDropdown.value;
    const selectedDivision = divisionDropdown.value;

    // Check if division and school are selected
    if (selectedDivision === 'default' || !selectedDivision) {
        toastr.error("Please select a division before chatting.", 'Error');
        return;
    }
    if (selectedSchoolName === 'default' || !selectedSchoolName) {
        toastr.error("Please select a school before chatting.", 'Error');
        return;
    }

    if (message) {
        appendMessage('user', message);
        chatHistory.push({ role: 'user', content: message });
        userInput.value = '';

        showLoadingIndicator();

        try {
            const response = await apiClient.post('/api/v1/chat', {
                userId,
                id: chatId,
                messages: chatHistory,
                contextQuery: { division: selectedDivision, school: selectedSchoolName },
            });

            hideLoadingIndicator();

            const { role, content } = response.data;
            if (response.status === 200 && role && content) {
                appendMessage(role, content);
                console.log(`Chat history ${response.data}`);
                chatHistory.push(response.data);
                await saveChatHistory();
            } else {
                console.error('Invalid response from backend:', response.data);
                appendMessage('assistant', 'Sorry, something went wrong. Please try again.');
            }
        } catch (error) {
            hideLoadingIndicator();
            console.error('Error sending message:', error);
            appendMessage('assistant', 'There was an error. Please try again.');
        }
        }
    };

    
        // Function to handle the chip question clicks
        function setQuestion(question) {
            userInput.value = question;
            sendMessage();
        }
    
        // Attach event listeners after the DOM is fully loaded
        document.addEventListener('DOMContentLoaded', function () {
            // Attach click event listener to chips
            const chips = document.querySelectorAll('#chips-container .chip');
            chips.forEach(chip => {
                chip.addEventListener('click', function () {
                    setQuestion(chip.textContent);
                });
            });
    
            // Attach event listener for send button
            sendButton.addEventListener('click', sendMessage);
    
            // Enter key press event for userInput
            userInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    sendMessage();
                }
            });
    
            // Division dropdown change event
            divisionDropdown.addEventListener('change', async () => {
                const selectedDivision = divisionDropdown.value;
                console.log(`Selected division: ${selectedDivision}`);
                await populateSchoolDropdown(selectedDivision);
            });
    
            // Initialize chat session on page load
            initializeChatSession();
        });
    </script>
    
    
</body>
</html>
